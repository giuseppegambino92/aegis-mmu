[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-mmu"
version = "0.1.0"
description = "Semantic MMU & self-healing execution proxy for AI coding agents: holographic AST folding, hybrid BM25/BQ/Matryoshka/ColBERT retrieval, append-only KV-cache paging, and HAR-to-MCP tool synthesis with Hungarian schema healing."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Giuseppe Gambino" }]
keywords = ["llm", "mcp", "rag", "colbert", "kv-cache", "proxy", "claude-code", "cursor"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Intended Audience :: Developers",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
tiktoken = ["tiktoken>=0.7"]

[project.scripts]
aegis = "aegis_mmu.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
